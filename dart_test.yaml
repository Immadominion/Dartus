# `flutter test` discovers only test/ and is deterministic/offline.
# Opt-in live checks are kept in live_test/ and require explicit configuration.
# Browser runtime: flutter test --platform chrome test/browser/ test/cache_regression_test.dart

tags:
  unit:
    description: "Deterministic tests with local fixtures or mocked dependencies"
  integration:
    description: "Explicitly selected live checks under live_test/"
  live-write:
    description: "Live writes requiring DARTUS_RUN_LIVE_WRITES=true"
  slow:
    description: "Tests that may take longer to complete"

timeout: 30s
platforms:
  - vm
